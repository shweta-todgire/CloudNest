<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" />
  <!-- Cloud shape -->
  <ellipse cx="90" cy="115" rx="52" ry="28" fill="url(#cloud)" />
  <circle cx="68" cy="108" r="22" fill="url(#cloud)" />
  <circle cx="100" cy="98" r="28" fill="url(#cloud)" />
  <circle cx="128" cy="108" r="18" fill="url(#cloud)" />
  <!-- Nest lines inside cloud -->
  <path d="M 72 118 Q 100 108 128 118" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 78 125 Q 100 116 122 125" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 85 131 Q 100 123 115 131" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Small bird/dot accent -->
  <circle cx="100" cy="78" r="5" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="88" cy="85" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="112" cy="84" r="3" fill="#38bdf8" opacity="0.5"/>
</svg>
